pages:
  stage: deploy
  image: alpine:latest
  script:
    # 1. Cria a pasta que o GitLab exige
    - mkdir public
    
    # 2. Copia apenas os arquivos soltos essenciais
    - cp index.html public/
    - cp main.js public/
    
    # 3. Copia apenas as pastas essenciais do jogo (ignorando 'documents' e outras)
    - cp -r assets public/
    - cp -r src public/
    
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    